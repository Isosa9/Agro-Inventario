[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agro-inventario"
dynamic = ["version"]
description = "Sistema de inventario y ventas para una agrocomercial"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.0,<3",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.dynamic]
# Única fuente de la versión: src/inventario/__init__.py (DRY)
version = { attr = "inventario.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inventario.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Permite ejecutar las pruebas sin instalar el proyecto (así lo hace el CI)
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "integracion: pruebas que se conectan a la base de datos real de Supabase",
]
filterwarnings = [
    "ignore:The '(timeout|verify)' parameter is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["src/inventario"]
branch = true
# Rutas relativas en los reportes: SonarCloud y la plataforma las encuentran en el repositorio
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: errores comunes · I: orden de imports · UP: sintaxis moderna · B: posibles bugs
select = ["E", "F", "I", "UP", "B"]
