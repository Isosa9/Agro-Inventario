name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: el workflow solo necesita leer el código
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # Acciones fijadas a un commit exacto (SHA): una etiqueta como v7 puede moverse,
      # un SHA no. El comentario indica la versión correspondiente.
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historial completo: SonarCloud lo usa para detectar el código nuevo

      - name: Instalar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias bloqueadas
        # --only-binary: solo paquetes precompilados, nunca se ejecutan scripts de instalación.
        # --require-hashes: cada paquete debe coincidir con el hash SHA-256 del archivo de bloqueo.
        # El proyecto no se instala: pytest lo encuentra en src/ (pythonpath en pyproject.toml).
        run: 'pip install --only-binary :all: --require-hashes -r requirements-dev.txt'

      - name: Revisar estilo y errores comunes
        run: ruff check .

      - name: Ejecutar pruebas con cobertura
        # Sin secretos de Supabase configurados en GitHub, las de integración se omiten.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: pytest --cov --cov-report=term --cov-report=xml:coverage.xml

      - name: Análisis de SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
