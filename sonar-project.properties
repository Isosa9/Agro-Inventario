# Configuración del análisis de SonarCloud (lo ejecuta GitHub Actions).
# Verifica estos dos valores en SonarCloud: Administration → Project Information.
sonar.projectKey=Isosa9_Agro-Inventario
sonar.organization=isosa9

sonar.projectName=Agro-Inventario
sonar.sourceEncoding=UTF-8

# Código de la aplicación y pruebas
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,docs/**,coverage/**,.venv/**,**/__pycache__/**
sonar.python.version=3.11,3.12,3.13

# Cobertura generada por pytest-cov en el CI
sonar.python.coverage.reportPaths=coverage.xml
